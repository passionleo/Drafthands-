    <!-- Schema.org Structured Data (JSON-LD) -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",

          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://drafthands.com.ng/#website",

            "@id": "https://drafthands.com.ng/#organization"
          },

        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://drafthands.com.ng/#application",

          "description": "Interactive virtual drafting board and CAD learning platform for secondary school and polytechnic engineering students.",
          "offers": {

    <!-- React Fast Refresh Preamble Safety Net -->
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>

    <!-- Anti-flash dark base styles -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        background-color: #020617;
        min-height: 100vh;
        width: 100%;
      }
      @keyframes dh-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes dh-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .dh-spinner {
        animation: dh-spin 0.9s linear infinite;
      }
      .dh-pulsing {
        animation: dh-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>

    <!-- Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Paystack Official Inline Checkout SDK -->
    <script async src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Early Error Catch & Progressive Web App (PWA) Global Capture -->
    <script>
      window.__drafthandsInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__drafthandsInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('drafthands:pwa-prompt-captured'));
      });

      window.addEventListener('appinstalled', function() {
        window.__drafthandsInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('drafthands:pwa-app-installed'));
      });

      window.__drafthandsMounted = false;
      window.addEventListener('error', function(e) {
        if (!window.__drafthandsMounted) {
          var rootEl = document.getElementById('root');
          var loaderEl = document.getElementById('dh-pre-loader');
          if (rootEl && loaderEl) {
            var errMsg = e && (e.message || (e.error && e.error.message)) ? String(e.message || e.error.message) : 'Resource loading issue';
            loaderEl.innerHTML = '<div style="max-width:440px;margin:0 auto;background:#0f172a;border:1px solid rgba(14,165,233,0.3);border-radius:16px;padding:24px;text-align:center;">' +
              '<div style="width:44px;height:44px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#f87171;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto;font-weight:bold;font-size:20px;">!</div>' +
              '<h2 style="font-size:16px;font-weight:bold;margin:0 0 8px 0;color:#fff;">DraftHands Academy</h2>' +
              '<p style="font-size:12px;color:#94a3b8;margin:0 0 14px 0;line-height:1.5;">Notice during startup: ' + errMsg + '</p>' +
              '<button onclick="window.location.reload()" style="background:#0284c7;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">Reload Session</button>' +
            '</div>';
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen m-0 p-0 antialiased selection:bg-cyan-500 selection:text-slate-950">
    <div id="root" class="min-h-screen w-full bg-slate-950 flex flex-col items-center justify-center p-6 text-center font-sans">
      <div style="max-width:380px;background:#090d16;border:1px solid rgba(56,189,248,0.3);border-radius:20px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">
        <div style="width:48px;height:48px;background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.4);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;">
          <svg class="dh-spinner" style="width:24px;height:24px;color:#38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        </div>
        <h2 style="font-size:16px;font-weight:bold;color:#fff;margin:0 0 6px 0;">DraftHands Academy</h2>
        <p style="font-size:12px;color:#94a3b8;margin:0 0 16px 0;">Loading Technical & Engineering Drawing Suite...</p>
        <button onclick="window.location.reload()" style="background:#0284c7;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Reload if stuck</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
